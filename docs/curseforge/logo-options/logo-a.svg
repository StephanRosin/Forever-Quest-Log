      <stop offset="1" stop-color="#2a0c06"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="72" fill="url(#bg)"/>

  <rect x="76" y="40" width="360" height="300" rx="22" fill="#000" opacity="0.7" filter="url(#soft)" transform="translate(0 7)"/>
  <g>
    <rect x="76" y="40" width="360" height="300" rx="22" fill="url(#gold)"/>
    <rect x="82" y="46" width="348" height="288" rx="17" fill="url(#panel)"/>
