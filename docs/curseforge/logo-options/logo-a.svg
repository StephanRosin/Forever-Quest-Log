  <!-- quest 3: complete -->
  <circle cx="118" cy="286" r="16" fill="url(#poi)" stroke="#3a2708" stroke-width="2"/>
  <text x="118" y="296" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="26" fill="#3a2708">?</text>
  <rect x="148" y="274" width="180" height="14" rx="7" fill="#ffd100"/>
  <path d="M150 307 l7 7 13 -14" fill="none" stroke="#5fd36b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="178" y="302" width="150" height="9" rx="4.5" fill="#5fd36b" opacity="0.85"/>
  <text x="256" y="420" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif" font-weight="bold" font-size="66" fill="url(#goldText)" stroke="#3a2708" stroke-width="2" letter-spacing="3">FOREVER</text>
  <text x="256" y="470" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif" font-weight="bold" font-size="38" fill="url(#goldText)" stroke="#3a2708" stroke-width="1" letter-spacing="6">QUEST LOG</text>
