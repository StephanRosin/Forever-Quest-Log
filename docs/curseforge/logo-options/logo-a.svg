  <rect x="82" y="46" width="348" height="52" rx="17" fill="#ffca30" opacity="0.08"/>
  <line x1="82" y1="98" x2="430" y2="98" stroke="#c79621" stroke-width="2" opacity="0.7"/>
  <text x="104" y="84" font-family="Georgia, 'DejaVu Serif', serif" font-size="30" fill="url(#goldText)">Quests</text>
  <path d="M392 66 l10 10 10 -10" fill="none" stroke="#b9a37a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -2) rotate(180 402 71)"/>
  <!-- quest 1 -->
  <circle cx="118" cy="134" r="16" fill="url(#poi)" stroke="#3a2708" stroke-width="2"/>
  <text x="118" y="144" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="26" fill="#3a2708">!</text>
