  <rect x="148" y="166" width="184" height="7" rx="3.5" fill="url(#bar)"/>
  <!-- quest 2 -->
  <circle cx="118" cy="210" r="16" fill="url(#poiDark)" stroke="#c79621" stroke-width="2"/>
  <circle cx="111" cy="210" r="2.6" fill="#f3d27a"/><circle cx="118" cy="210" r="2.6" fill="#f3d27a"/><circle cx="125" cy="210" r="2.6" fill="#f3d27a"/>
  <rect x="148" y="198" width="230" height="14" rx="7" fill="#ffd100"/>
  <rect x="148" y="224" width="170" height="9" rx="4.5" fill="#d6d2c8" opacity="0.8"/>
