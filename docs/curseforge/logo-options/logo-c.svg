<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#2a3346"/>
      <stop offset="0.6" stop-color="#151a26"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="0.35" stop-color="#e8c25a"/>
      <stop offset="0.7" stop-color="#a87a22"/>
      <stop offset="1" stop-color="#6e4c12"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4c2"/>
      <stop offset="0.55" stop-color="#e6bd52"/>
      <stop offset="1" stop-color="#9c6f1c"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c79621"/>
      <stop offset="1" stop-color="#ffd24a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1a17"/>
      <stop offset="1" stop-color="#0d0d0f"/>
    </linearGradient>
    <linearGradient id="parch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1e0b0"/>
      <stop offset="1" stop-color="#c9a86a"/>
    </linearGradient>
    <radialGradient id="poi" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff3a0"/>
      <stop offset="0.6" stop-color="#ffcc1a"/>
      <stop offset="1" stop-color="#a87400"/>
    </radialGradient>
    <radialGradient id="poiDark" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#7a2a1a"/>
      <stop offset="1" stop-color="#2a0c06"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="72" fill="url(#bg)"/>

  <circle cx="256" cy="196" r="128" fill="#ffd24a" opacity="0.18" filter="url(#glow)"/>
  <circle cx="256" cy="196" r="132" fill="#000" opacity="0.7" filter="url(#soft)" transform="translate(0 7)"/>
  <g>
    <circle cx="256" cy="196" r="132" fill="url(#gold)"/>
    <circle cx="256" cy="196" r="118" fill="url(#panel)"/>
  </g>
  <circle cx="256" cy="196" r="110" fill="none" stroke="#c79621" stroke-width="2" opacity="0.5"/>
  <!-- a mini tracker inside the emblem -->
  <g>
    <circle cx="186" cy="146" r="14" fill="url(#poi)" stroke="#3a2708" stroke-width="2"/>
    <text x="186" y="155" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="22" fill="#3a2708">!</text>
    <rect x="210" y="136" width="122" height="12" rx="6" fill="#ffd100"/>
    <rect x="210" y="156" width="122" height="6" rx="3" fill="#fff" opacity="0.12"/>
    <rect x="210" y="156" width="86" height="6" rx="3" fill="url(#bar)"/>

    <circle cx="186" cy="200" r="14" fill="url(#poiDark)" stroke="#c79621" stroke-width="2"/>
    <circle cx="180" cy="200" r="2.3" fill="#f3d27a"/><circle cx="186" cy="200" r="2.3" fill="#f3d27a"/><circle cx="192" cy="200" r="2.3" fill="#f3d27a"/>
    <rect x="210" y="190" width="104" height="12" rx="6" fill="#ffd100"/>
    <rect x="210" y="210" width="122" height="6" rx="3" fill="#fff" opacity="0.12"/>
    <rect x="210" y="210" width="40" height="6" rx="3" fill="url(#bar)"/>

    <circle cx="186" cy="254" r="14" fill="url(#poi)" stroke="#3a2708" stroke-width="2"/>
    <path d="M179 254 l5 5 9 -10" fill="none" stroke="#3a2708" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="210" y="248" width="112" height="12" rx="6" fill="#5fd36b" opacity="0.9"/>
  </g>
  <text x="256" y="408" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif" font-weight="bold" font-size="66" fill="url(#goldText)" stroke="#3a2708" stroke-width="2" letter-spacing="3">FOREVER</text>
  <text x="256" y="458" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif" font-weight="bold" font-size="38" fill="url(#goldText)" stroke="#3a2708" stroke-width="1" letter-spacing="6">QUEST LOG</text>
</svg>
