<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#2a3346"/>
      <stop offset="0.6" stop-color="#151a26"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="0.35" stop-color="#e8c25a"/>
      <stop offset="0.7" stop-color="#a87a22"/>
      <stop offset="1" stop-color="#6e4c12"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4c2"/>
      <stop offset="0.55" stop-color="#e6bd52"/>
      <stop offset="1" stop-color="#9c6f1c"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c79621"/>
      <stop offset="1" stop-color="#ffd24a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1a17"/>
      <stop offset="1" stop-color="#0d0d0f"/>
    </linearGradient>
    <linearGradient id="parch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1e0b0"/>
      <stop offset="1" stop-color="#c9a86a"/>
    </linearGradient>
    <radialGradient id="poi" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff3a0"/>
      <stop offset="0.6" stop-color="#ffcc1a"/>
      <stop offset="1" stop-color="#a87400"/>
    </radialGradient>
    <radialGradient id="poiDark" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#7a2a1a"/>
      <stop offset="1" stop-color="#2a0c06"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="72" fill="url(#bg)"/>

  <rect x="118" y="96" width="276" height="330" rx="10" fill="#000" opacity="0.7" filter="url(#soft)" transform="translate(0 7)"/>
  <g>
    <!-- scroll -->
    <rect x="118" y="96" width="276" height="330" rx="10" fill="url(#parch)"/>
    <rect x="100" y="70" width="312" height="44" rx="22" fill="url(#gold)"/>
    <rect x="100" y="408" width="312" height="44" rx="22" fill="url(#gold)"/>
    <rect x="108" y="78" width="296" height="10" rx="5" fill="#fff" opacity="0.35"/>
    <rect x="108" y="416" width="296" height="10" rx="5" fill="#fff" opacity="0.3"/>
  </g>
  <!-- lines on the scroll -->
  <g stroke="#6b4a1c" stroke-width="7" stroke-linecap="round" opacity="0.55">
    <line x1="150" y1="150" x2="300" y2="150"/>
    <line x1="150" y1="184" x2="260" y2="184"/>
    <line x1="150" y1="236" x2="290" y2="236"/>
    <line x1="150" y1="270" x2="240" y2="270"/>
    <line x1="150" y1="322" x2="280" y2="322"/>
    <line x1="150" y1="356" x2="230" y2="356"/>
  </g>
  <g fill="#6b4a1c" opacity="0.55"><circle cx="134" cy="150" r="5"/><circle cx="134" cy="236" r="5"/><circle cx="134" cy="322" r="5"/></g>
  <!-- progress under the second -->
  <rect x="150" y="290" width="160" height="9" rx="4.5" fill="#6b4a1c" opacity="0.25"/>
  <rect x="150" y="290" width="104" height="9" rx="4.5" fill="url(#bar)"/>
  <!-- big quest mark, glowing -->
  <circle cx="350" cy="250" r="78" fill="#ffd24a" opacity="0.55" filter="url(#glow)"/>
  <circle cx="350" cy="250" r="72" fill="url(#poi)" stroke="#3a2708" stroke-width="5"/>
  <circle cx="350" cy="250" r="61" fill="none" stroke="#fff4c2" stroke-width="3" opacity="0.6"/>
  <rect x="337" y="196" width="26" height="72" rx="13" fill="#3a2708"/>
  <circle cx="350" cy="292" r="14" fill="#3a2708"/>
</svg>
